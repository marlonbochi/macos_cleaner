[package]
name = "macos-cleaner"
description = "macOS Cleaner desktop app (Tauri composition root and IPC commands)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
# The `_lib` suffix avoids a name clash between the lib and bin targets.
name = "macos_cleaner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cleaner-core.workspace = true
cleaner-infra.workspace = true
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
ts-rs = "12.0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tauri-plugin-dialog = "2"

[lints]
workspace = true
