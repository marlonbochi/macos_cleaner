[workspace]
resolver = "3"
members = ["crates/cleaner-core", "crates/cleaner-infra", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Marlon Bochi"]
rust-version = "1.95"

[workspace.dependencies]
cleaner-core = { path = "crates/cleaner-core" }
cleaner-infra = { path = "crates/cleaner-infra" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "warn"
needless_pass_by_value = "warn"
semicolon_if_nothing_returned = "warn"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
