[package]
name = "cleaner-infra"
description = "Adapters (filesystem, SQLite, AI providers, macOS) for Disk Cleaner"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
cleaner-core.workspace = true
jwalk = "0.9.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.5.0"
security-framework = "3.7.0"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
trash = { version = "5.2.9", default-features = false }

[dev-dependencies]
cleaner-core = { workspace = true, features = ["testing"] }
mockito = "1.7.2"
tempfile = "3.27.0"

[lints]
workspace = true
