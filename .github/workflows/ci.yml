name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # Also run as the gate of the release workflow.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux builds on 22.04 so the .deb runs on Debian 12 (glibc 2.36) and newer.
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: ./scripts/ci/linux-deps.sh
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
        if: runner.os == 'macOS'
      # tauri-build checks that the frontend dist folder exists at compile time.
      - run: mkdir -p dist
      - name: Format
        if: runner.os == 'macOS'
        run: cargo fmt --all --check
      # --keep-going / --no-fail-fast report every problem in one run instead of stopping at the
      # first crate that fails.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --keep-going -- -D warnings
      - name: Tests with coverage (core + infra >= 80% lines)
        if: runner.os == 'macOS'
        run: >
          cargo llvm-cov --workspace --all-features
          --ignore-filename-regex 'src-tauri/'
          --fail-under-lines 80
          --lcov --output-path lcov.info
      - name: Tests
        if: runner.os != 'macOS'
        run: cargo test --workspace --all-features --no-fail-fast
      - uses: actions/upload-artifact@v7
        if: runner.os == 'macOS'
        with:
          name: rust-coverage
          path: lcov.info

  frontend:
    name: Frontend (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: coverage/

  types:
    name: TS bindings are up to date
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: mkdir -p dist
      - run: npm run gen:types
      - name: Fail if generated types changed
        run: git diff --exit-code -- src/types/generated

  build:
    name: Build app (${{ matrix.name }})
    needs: [rust, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS .dmg
            os: macos-latest
            bundles: dmg
            artifact: target/release/bundle/dmg/*.dmg
          - name: Windows installer
            os: windows-latest
            bundles: nsis
            artifact: target/release/bundle/nsis/*.exe
          - name: Debian package
            os: ubuntu-22.04
            bundles: deb
            artifact: target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: ./scripts/ci/linux-deps.sh
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run tauri build -- --bundles ${{ matrix.bundles }}
      # Without a valid (ad-hoc) signature on the whole bundle, macOS may call a downloaded
      # copy "damaged" instead of offering "Open Anyway".
      - name: Check the app bundle signature
        if: runner.os == 'macOS'
        run: |
          dmg=$(ls target/release/bundle/dmg/*.dmg)
          mount=$(hdiutil attach -nobrowse -readonly "$dmg" | tail -1 | cut -f3)
          codesign --verify --deep --strict --verbose=2 "$mount/Disk Cleaner.app"
          hdiutil detach "$mount"
      - name: Check the Debian package
        if: runner.os == 'Linux'
        run: |
          deb=$(ls target/release/bundle/deb/*.deb)
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb" | grep -E "usr/bin/disk-cleaner$"
      - uses: actions/upload-artifact@v7
        with:
          name: disk-cleaner-${{ runner.os }}
          path: ${{ matrix.artifact }}
          retention-days: 7
